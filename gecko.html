<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluoddity CA Gecko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --void:#030506;
  --panel:rgba(12,16,18,.88);
  --line:#22303a;
  --ink:#dfe7ea;
  --ink2:#8197a0;
  --accent:#e7a54a;
  --font-display:"Sora", "Segoe UI", system-ui, sans-serif;
  --font-data:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:12px/1.4 var(--font-data);overflow:hidden}
body{display:flex;height:100%}
#c{flex:1 1 auto;min-width:0;height:100%;display:block;touch-action:none;cursor:crosshair}
#panel{flex:0 0 312px;height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
  background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
#panel header{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#panel h1{margin:0;font:600 15px/1.2 var(--font-display);letter-spacing:.01em}
#panel h1 span{color:var(--accent)}
#stat{color:var(--ink2);font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
#stat div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:1.4em}
#scroll{overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:6px}
.grp h2{margin:0;font:500 10px/1 var(--font-data);text-transform:uppercase;letter-spacing:.12em;color:var(--ink2)}
.row{display:grid;grid-template-columns:96px 1fr 58px;gap:6px;align-items:center}
.row label{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input[type=number]{width:100%;background:#0a0e10;color:var(--ink);border:1px solid var(--line);border-radius:3px;
  font:11px var(--font-data);padding:2px 4px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
select,button{font:12px var(--font-data);color:var(--ink);background:#0d1316;border:1px solid var(--line);border-radius:4px;padding:5px 7px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:flex;gap:6px;align-items:center;color:var(--ink2)}
.sel{display:grid;grid-template-columns:96px 1fr;gap:6px;align-items:center;color:var(--ink2)}
.note{color:var(--ink2);line-height:1.5}
.note b{color:var(--ink);font-weight:500}
.note a{color:var(--accent)}
#inset{display:flex;gap:10px;align-items:flex-start}
#tgt{width:128px;height:128px;image-rendering:pixelated;border:1px solid var(--line);background:#000;flex:0 0 auto;cursor:pointer}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ink)}
#toggle{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:none}
body.hidep #panel{display:none}
body.hidep #toggle{display:block}
@media (max-width:640px){
  body{flex-direction:column}
  #c{height:auto;flex:1 1 54%}
  #panel{flex:0 0 46%;height:auto;border-left:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
}
</style>

<canvas id="c"></canvas>
<div id="err"></div>
<button id="toggle" type="button">controls (H)</button>
<div id="panel">
  <header>
    <h1>Fluoddity CA <span>gecko</span></h1>
    <div id="stat"><div id="stat1">&nbsp;</div><div id="stat2">&nbsp;</div><div id="stat3">&nbsp;</div></div>
  </header>
  <div id="scroll">
    <div class="grp">
      <h2>Run</h2>
      <div class="btns">
        <button id="b-pause" type="button" title="Space">pause</button>
        <button id="b-reset" type="button" title="R">restart from seed</button>
        <button id="b-step" type="button" title=". (one step, paused)">step</button>
      </div>
      <div id="g-run"></div>
      <div class="sel"><span>model</span><select id="model-sel" title="each model is its own page"></select></div>
    </div>
    <div class="grp">
      <h2>Damage</h2>
      <div id="g-dmg"></div>
      <div class="btns"><button id="b-cut-rand" type="button" title="cut a random hole in the body">random hole</button><button id="b-shake" type="button" title="give every cell a random velocity kick (mass kept)">shake everything</button></div>
    </div>
    <div class="grp">
      <h2>Physics</h2>
      <div id="g-phys"></div>
      <div class="btns"><button id="b-trained" type="button">reset to trained values</button></div>
    </div>
    <div class="grp">
      <h2>View</h2>
      <div id="g-view"></div>
      <div id="inset"><canvas id="tgt" width="128" height="128" title="the target, gecko.png (T shows it full size)"></canvas></div>
    </div>
  </div>
</div>

  brain: compile(VS_QUAD, FS_BRAIN), move: compile(VS_MOVE, FS_MOVE), trail: compile(VS_QUAD, FS_TRAIL),
  view: compile(VS_QUAD, FS_VIEW), erase: compile(VS_QUAD, FS_ERASE), push: compile(VS_QUAD, FS_PUSH), disp: compile(VS_QUAD, FS_DISP), eraseT: compile(VS_QUAD, FS_ERASE_T), tone: compile(VS_QUAD, FS_TONE), down: compile(VS_QUAD, FS_DOWN), up: compile(VS_QUAD, FS_UP),

// ---------------------------------------------------------------- GPU resources
function tex(w, h, ifmt, fmt, type, filter, data=null){

  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

}
function fbo(...ts){
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  ts.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0+i, gl.TEXTURE_2D, t, 0));
  gl.drawBuffers(ts.map((_, i) => gl.COLOR_ATTACHMENT0+i));
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) fail("Framebuffer incomplete.");
  f.w = ts[0].w; f.h = ts[0].h; return f;
}
const rgba32 = (w, h, data=null) => tex(w, h, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST, data);
const rgba16 = (w, h) => tex(w, h, gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT, gl.LINEAR);

const st = [0, 1].map(() => [0, 1, 2, 3].map(() => rgba32(N, N)));     // [ping-pong][texture]
const stF = st.map(ts => fbo(...ts));
const Q = [0, 1, 2, 3, 4].map(() => rgba32(N, N)), QF = fbo(...Q);
const trl = [0, 1].map(() => tex(N, N, gl.RG32F, gl.RG, gl.FLOAT, gl.NEAREST)), trlF = trl.map(t => fbo(t));
const wTex = rgba32(256, W.rows, W.data);

// the seed: the model's own state at t = 0 over its patch, zero elsewhere
const SEED = (() => {
  const s = dec(G.seed), [C, S] = [s.shape[0], s.shape[1]], o = G.seed_s0;
  const out = [0, 1, 2, 3].map(() => new Float32Array(N*N*4));
  for(let c = 0; c < C; c++) for(let y = 0; y < S; y++) for(let x = 0; x < S; x++)
    out[c >> 2][((y + o)*N + x + o)*4 + (c & 3)] = s[(c*S + y)*S + x];
  return out;
})();

// the target: gecko.png, row 0 at the bottom, centred; mass = alpha, colour = rgb*alpha
const TGT = (() => {
  const t = G.target, b = atob(t.rgba), m = new Float32Array(N*N), rgb = new Float32Array(3*N*N), tex4 = new Float32Array(N*N*4);
  const img = new ImageData(t.w, t.h);
  for(let i = 0; i < b.length; i++) img.data[i] = b.charCodeAt(i);
  for(let r = 0; r < t.h; r++) for(let x = 0; x < t.w; x++){
    const k = (r*t.w + x)*4, y = t.h - 1 - r + t.off, cx = x + t.off, i = y*N + cx;
    const a = img.data[k + 3]/255;
    m[i] = a;
    for(let c = 0; c < 3; c++){ rgb[c*N*N + i] = img.data[k + c]/255*a; tex4[i*4 + c] = rgb[c*N*N + i]; }
    tex4[i*4 + 3] = a;
  }
  let mm = 0, cm = 0; for(let i = 0; i < N*N; i++) mm = Math.max(mm, m[i]); for(const v of rgb) cm = Math.max(cm, v);
  return {m, rgb, img, tex: rgba32(N, N, tex4), mmax: mm, cmax: cm};
})();

let D = null;
function buildDisplay(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(cv.clientWidth*dpr)); cv.height = Math.max(1, Math.round(cv.clientHeight*dpr));
  const S = Math.max(64, Math.min(2048, Math.min(cv.width, cv.height)));
  const lin = rgba16(S, S), tone = rgba16(S, S), copy = rgba16(S, S), comp = rgba16(S, S);
  const mips = [], ups = []; let m = S;
  for(let i=0;i<5;i++){ m = Math.max(1, m>>1); mips.push(rgba16(m, m)); ups.push(rgba16(m, m)); }
  D = { S, lin, tone, copy, comp, mips, ups, linF: fbo(lin), toneF: fbo(tone), copyF: fbo(copy), compF: fbo(comp),
        mipF: mips.map(t => fbo(t)), upF: ups.map(t => fbo(t)) };
}

// ---------------------------------------------------------------- the step
let cur = 0, tcur = 0, step = 0;
function bindTex(unit, t, prog, name){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(prog.u[name], unit); }
function target(f){ gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.viewport(0, 0, f ? f.w : cv.width, f ? f.h : cv.height); }
function upload(t, data){ gl.bindTexture(gl.TEXTURE_2D, t); gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, N, N, gl.RGBA, gl.FLOAT, data); }

function restart(){
  cur = 0; tcur = 0; step = 0;
  for(let k = 0; k < 4; k++) upload(st[0][k], SEED[k]);
  target(trlF[0]); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  lossAt = -1;
}

// the physics the step uses: the trained values, editable from the panel. While they are
// untouched the exported constants are used as they are (bit-identical to torch); once any is
// changed, the constants are derived here the way the step derives them.
const TRAINED = { ...G.phys, mgain: G.mgain, hgain: G.hgain, brake: G.bb, rest: G.rest };
const PH = { ...TRAINED };
let edited = false;
const SQ = N/1024;   // sqrt(world size) for a 256 grid
function derived(){
  if(!edited) return D_;
  const pc = Math.min(0.999, Math.max(0.001, PH.persist)), dd = PH.diff*PH.diff;
  return { cos_a: Math.cos(PH.angle*Math.PI), sin_a: Math.sin(PH.angle*Math.PI), sd: 1/SQ*0.005*PH.dist,
           scaling: SQ*38.855*PH.gain, fcoef: 1/SQ*PH.gfm/400, scoef: 1/SQ*PH.gfm/20, pcoef: PH.press*(2/N),
           K: dd > 1e-7 ? 4/(Math.pow(5, dd) - 1) : 1e7, persist: PH.persist, deposit: 1 - pc, cells: N/2 };
}
// wipe a disc at (x, y) cells: all of the state, and the trail under it if asked
function damage(x, y, r){
  gl.disable(gl.BLEND);
  let pr = P.erase; gl.useProgram(pr.p);
  for(let k = 0; k < 4; k++) bindTex(k, st[cur][k], pr, "uS" + k);
  gl.uniform3f(pr.u.uCut, x, y, r);
  const nx = 1 - cur; target(stF[nx]); gl.drawArrays(gl.TRIANGLES, 0, 3); cur = nx;
  if(look.cut_trail){
    pr = P.eraseT; gl.useProgram(pr.p); bindTex(0, trl[tcur], pr, "uT"); gl.uniform3f(pr.u.uCut, x, y, r);
    const tn = 1 - tcur; target(trlF[tn]); gl.drawArrays(gl.TRIANGLES, 0, 3); tcur = tn;
  }
  cuts++;
}
let cuts = 0;
function displace(x, y, r, dx, dy){
  gl.disable(gl.BLEND);
  let pr = P.disp; gl.useProgram(pr.p);
  for(let k = 0; k < 4; k++) bindTex(k, st[cur][k], pr, "uS" + k);
  gl.uniform3f(pr.u.uCut, x, y, r); gl.uniform2f(pr.u.uDv, dx, dy);
  target(QF); gl.drawArrays(gl.TRIANGLES, 0, 3);
  const nx = 1 - cur;
  target(stF[nx]); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  pr = P.move; gl.useProgram(pr.p);
  for(let k = 0; k < 4; k++) bindTex(k, Q[k], pr, "uQ" + k);
  bindTex(4, Q[4], pr, "uD"); gl.uniform1f(pr.u.uBox, 1.0); gl.uniform1i(pr.u.uK, 2);
  gl.enable(gl.BLEND); gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArrays(gl.POINTS, 0, 4*N*N);

}
function push(mode, x, y, r, dvx, dvy){
  gl.disable(gl.BLEND);
  const pr = P.push; gl.useProgram(pr.p);
  for(let k = 0; k < 4; k++) bindTex(k, st[cur][k], pr, "uS" + k);
  gl.uniform3f(pr.u.uCut, x, y, r); gl.uniform1i(pr.u.uMode, mode); gl.uniform2f(pr.u.uDv, dvx, dvy); gl.uniform1f(pr.u.uSeed, Math.random()*100);

}
function physicsStep(){
  const D_ = derived();

  gl.disable(gl.BLEND);
  // 1. brain
  let pr = P.brain; gl.useProgram(pr.p);
  for(let k = 0; k < 4; k++) bindTex(k, st[cur][k], pr, "uS" + k);

  gl.uniform1f(U.uFC, D_.fcoef); gl.uniform1f(U.uSC, D_.scoef); gl.uniform1f(U.uAxial, ph.axial); gl.uniform1f(U.uLateral, ph.lateral);
  gl.uniform1f(U.uDrag, ph.drag); gl.uniform1f(U.uStrafeP, ph.strafe); gl.uniform1f(U.uMG, PH.mgain); gl.uniform1f(U.uHG, PH.hgain);
  gl.uniform1f(U.uBB, PH.brake); gl.uniform1f(U.uPC, D_.pcoef); gl.uniform1f(U.uRest, PH.rest); gl.uniform1f(U.uOriMix, G.orimix);
  gl.uniform1f(U.uCells, D_.cells); gl.uniform1i(U.uAbsOri, G.absori); gl.uniform1i(U.uSym, G.sym ? 1 : 0); gl.uniform1i(U.uPress, G.pressure_on ? 1 : 0); gl.uniform1f(U.uStep, step);
  target(QF); gl.drawArrays(gl.TRIANGLES, 0, 3);
  // 2. move
  const nx = 1 - cur;
  target(stF[nx]); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  pr = P.move; gl.useProgram(pr.p);
  for(let k = 0; k < 4; k++) bindTex(k, Q[k], pr, "uQ" + k);
  bindTex(4, Q[4], pr, "uD"); gl.uniform1f(pr.u.uBox, box); gl.uniform1i(pr.u.uK, nt);
  gl.enable(gl.BLEND); gl.blendEquation(gl.FUNC_ADD); gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArrays(gl.POINTS, 0, nt*nt*N*N);

  const tn = 1 - tcur;

}

// ---------------------------------------------------------------- readback and loss (the training loss)
function readTex(t){
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const b = new Float32Array(N*N*4); gl.readPixels(0, 0, N, N, gl.RGBA, gl.FLOAT, b);
  gl.deleteFramebuffer(f); return b;
}
function fields(){   // mass [N*N] and render rgb [3*N*N], channel-major, row 0 at the bottom
  const a = readTex(st[cur][0]), c = readTex(st[cur][2]);
  const m = new Float32Array(N*N), rgb = new Float32Array(3*N*N);
  for(let i = 0; i < N*N; i++){ m[i] = a[4*i]; for(let k = 0; k < 3; k++) rgb[k*N*N + i] = (a[4*i] + c[4*i + 1 + k])*0.5; }
  return {m, rgb};
}
function msLoss(x, t, C){   // multiscale MSE over the target's power, scales 1 2 4 8 (avg pool)
  let L = 0;
  for(const s of [1, 2, 4, 8]){
    const n = N/s; let num = 0, den = 0;
    for(let c = 0; c < C; c++) for(let by = 0; by < n; by++) for(let bx = 0; bx < n; bx++){
      let a = 0, b = 0;
      for(let y = 0; y < s; y++) for(let xx = 0; xx < s; xx++){ const i = c*N*N + (by*s + y)*N + bx*s + xx; a += x[i]; b += t[i]; }
      a /= s*s; b /= s*s; num += (a - b)*(a - b); den += b*b;
    }
    L += num/den;
  }
  return L/4;
}
let lossAt = -1, lossM = NaN, lossC = NaN, totalMass = G.total_mass;
function measure(){
  const f = fields(); lossM = msLoss(f.m, TGT.m, 1); lossC = msLoss(f.rgb, TGT.rgb, 3); lossAt = step;
  let s = 0; for(const v of f.m) s += v; totalMass = s;
}

// ---------------------------------------------------------------- display
const look = { tool: 0, brush: 12, cut_trail: true, push_k: 0.3, shake: 1.0, kick: 0.4, speed: 30, restart_at: 0, mode: 0, brightness: 1.0, glow: false, smooth: false, show_target: false, loss: true };
const cam = { x: 0, y: 0, zoom: 1.0 };
const brush = { x: 0, y: 0, on: false };   // zoom 0.625: the central 160 cells, as in the training pictures
function present(){
  let pr = P.view; gl.useProgram(pr.p); gl.disable(gl.BLEND);
  bindTex(0, st[cur][0], pr, "uS0"); bindTex(1, st[cur][2], pr, "uS2"); bindTex(2, TGT.tex, pr, "uTgt");

  gl.uniform1f(pr.u.uZoom, cam.zoom); gl.uniform2f(pr.u.uCam, cam.x, cam.y);

  target(D.toneF); gl.drawArrays(gl.TRIANGLES, 0, 3);

    pr = P.down; gl.useProgram(pr.p); gl.uniform1f(pr.u.uSoft, soft); gl.uniform1f(pr.u.uThreshold, 0.11);
    bindTex(0, D.tone, pr, "uSrc"); gl.uniform2f(pr.u.uTexel, 1/D.S, 1/D.S); gl.uniform1i(pr.u.uThresh, 0);

  bindTex(0, D.comp, pr, "uSrc"); gl.drawArrays(gl.TRIANGLES, 0, 3);
}

  ["drag", "drag", 0, 1.2, 0.001], ["strafe", "strafe power", 0, 1, 0.001], ["angle", "sensor angle", -1, 1, 0.001],
  ["gfm", "force mult", 0, 0.5, 0.001], ["dist", "sensor dist", 0, 4, 0.01], ["persist", "persistence", 0, 1, 0.001],
  ["diff", "diffusion", 0, 1, 0.001], ["press", "pressure", 0, 2, 0.01], ["rest", "rest mass", 0, 5, 0.01],
  ["spread", "spread (cells)", 1, 3, 0.05], ["brake", "brake", 0, 10, 0.01], ["mgain", "mass sight", 0, 3, 0.01],
  ["hgain", "hidden sight", 0, 3, 0.01]]) rowSlider(gP, k, label, lo, hi, s, PH, mark);
$("b-trained").onclick = () => { Object.assign(PH, TRAINED); edited = false; syncUI(); flash("trained values"); };
syncUI();

// the target inset
{ const c = $("tgt"), x = c.getContext("2d"); x.putImageData(TGT.img, 0, 0);
  c.onclick = () => { look.show_target = !look.show_target; syncUI(); }; }

let paused = false, flashMsg = "", flashT = 0;
function flash(m){ flashMsg = m; flashT = performance.now(); }
const act = {
  pause(){ paused = !paused; $("b-pause").textContent = paused ? "play" : "pause"; },
  reset(){ restart(); flash("restarted from the seed"); },
  one(){ if(!paused) act.pause(); physicsStep(); },
};
$("b-pause").onclick = act.pause; $("b-reset").onclick = act.reset; $("b-step").onclick = act.one;
$("toggle").onclick = () => document.body.classList.remove("hidep");
window.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const k = e.key.toLowerCase();
  if(k === "r") act.reset(); else if(k === " "){ e.preventDefault(); act.pause(); } else if(k === ".") act.one();
  else if(k === "t"){ look.show_target = !look.show_target; syncUI(); }
  else if(k === "h") document.body.classList.toggle("hidep");
  else if(k === "d"){ look.tool = (look.tool + 1) % 5; cv.style.cursor = look.tool > 0 ? "none" : "crosshair"; syncUI(); flash(["pan", "cut", "push", "poke", "twirl"][look.tool] + " tool"); }
});
let drag = null;
// screen -> cell coordinates, the inverse of the view shader
function toCell(e){
  const r = cv.getBoundingClientRect(), s = Math.min(r.width, r.height);
  const nx = ((e.clientX - r.left) - (r.width - s)/2)/s*2 - 1, ny = 1 - ((e.clientY - r.top) - (r.height - s)/2)/s*2;
  return [128 + (nx*cam.zoom + cam.x)*128, 128 + (ny*cam.zoom + cam.y)*128];
}
let cutting = false, lastCut = null, pushing = null, holding = null;
// poke / twirl: one kick on press, and another every frame while the button is held
function kickAt(){ if(holding) push(look.tool === 3 ? 2 : 3, holding[0], holding[1], look.brush, look.kick, 0); }
function cutAt(e){
  const [x, y] = toCell(e);
  if(lastCut){   // fill the gap between pointer events so a fast stroke is a continuous cut
    const dx = x - lastCut[0], dy = y - lastCut[1], n = Math.min(64, Math.ceil(Math.hypot(dx, dy)/Math.max(1, look.brush*0.5)));
    for(let i = 1; i <= n; i++) damage(lastCut[0] + dx*i/n, lastCut[1] + dy*i/n, look.brush);
  } else damage(x, y, look.brush);
  lastCut = [x, y];
}
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  if(look.tool === 1 && e.button === 0 && !e.shiftKey){ cutting = true; lastCut = null; cutAt(e); return; }
  if(look.tool === 2 && e.button === 0 && !e.shiftKey){ pushing = toCell(e); return; }
  if(look.tool >= 3 && e.button === 0 && !e.shiftKey){ holding = toCell(e); kickAt(); return; }
  drag = {x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y};
});
cv.addEventListener("pointermove", e => {
  const [bx, by] = toCell(e); brush.x = bx; brush.y = by; brush.on = true;
  if(cutting){ cutAt(e); return; }
  if(holding){ holding = toCell(e); return; }
  if(pushing){   // kick the cells under the brush along the drag: strength x the drag in cells
    const [x, y] = toCell(e), dx = x - pushing[0], dy = y - pushing[1];
    const L = Math.hypot(dx, dy);
    if(L > 0.25){ const n = Math.ceil(L); for(let i = 0; i < n; i++) displace(pushing[0] + dx*(i + 0.5)/n, pushing[1] + dy*(i + 0.5)/n, look.brush, dx/n, dy/n); pushing = [x, y]; }
    return;
  }
  if(!drag) return; const r = cv.getBoundingClientRect(), s = Math.min(r.width, r.height);
  cam.x = drag.cx - (e.clientX - drag.x)/s*2*cam.zoom; cam.y = drag.cy + (e.clientY - drag.y)/s*2*cam.zoom;
});
cv.addEventListener("pointerup", () => { drag = null; if(holding){ holding = null; flash(look.tool === 3 ? "poked" : "twirled"); } if(pushing){ pushing = null; flash("pushed"); } if(cutting){ cutting = false; lastCut = null; flash("cut"); } });
cv.addEventListener("pointerleave", () => { brush.on = false; });
cv.addEventListener("dblclick", () => { if(look.tool === 1) return; cam.x = 0; cam.y = 0; cam.zoom = 1.0; });
cv.addEventListener("wheel", e => {
  e.preventDefault(); const r = cv.getBoundingClientRect(), s = Math.min(r.width, r.height);
  const nx = ((e.clientX - r.left) - (r.width - s)/2)/s*2 - 1, ny = 1 - ((e.clientY - r.top) - (r.height - s)/2)/s*2;
  const wx = nx*cam.zoom + cam.x, wy = ny*cam.zoom + cam.y;
  cam.zoom = Math.min(2.0, Math.max(0.05, cam.zoom*Math.exp(e.deltaY*0.0015)));
  cam.x = wx - nx*cam.zoom; cam.y = wy - ny*cam.zoom;
}, {passive:false});
let resizeT = 0;
new ResizeObserver(() => { clearTimeout(resizeT); resizeT = setTimeout(buildDisplay, 60); }).observe(cv);

// ---------------------------------------------------------------- go
buildDisplay(); restart();
let win = {t: performance.now(), f: 0, s: 0}, fps = 0, sps = 0, stepAcc = 0, lastT = performance.now();
function loop(){
  // steps per SECOND, from the real frame time, so the speed is the same at 60 Hz and at 144 Hz
  const tNow = performance.now(), dt = Math.min(0.1, (tNow - lastT)/1000); lastT = tNow;
  stepAcc = paused ? 0 : stepAcc + Math.max(0.1, look.speed)*dt;
  const n = Math.min(64, Math.floor(stepAcc)); stepAcc -= Math.floor(stepAcc);
  for(let i = 0; i < n; i++){
    physicsStep();
    if(look.restart_at > 0 && step >= look.restart_at) restart();
  }
  if(holding) kickAt();
  if(look.loss && step !== lossAt && (step % 8 === 0 || paused || lossAt < 0 || step - lossAt >= 8)) measure();
  present();
  const now = performance.now(); win.f++; win.s += n;
  if(now - win.t >= 1000){ fps = win.f*1000/(now - win.t); sps = win.s*1000/(now - win.t); win = {t: now, f: 0, s: 0}; }
  const msg = performance.now() - flashT < 1800 ? " · " + flashMsg : "";
  $("stat1").textContent = `step ${step} · ${paused ? "paused" : sps.toFixed(sps < 10 ? 1 : 0) + " steps/s"} · ${fps.toFixed(0)} fps` + (edited ? " · edited physics" : "") + msg;
  $("stat2").textContent = look.loss && lossAt >= 0 ? `loss at ${lossAt}: mass ${lossM.toFixed(3)} · colour ${lossC.toFixed(3)}` : "loss: off";
  $("stat3").textContent = `${N}² cells · mass ${totalMass.toFixed(1)} of ${G.total_mass.toFixed(1)}` + (look.show_target ? " · target" : "");
  requestAnimationFrame(loop);
}
const b64f = a => { const u = new Uint8Array(a.buffer); let s = ""; for(let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
// ---------------------------------------------------------------- which model (all inlined by src/build.py; ?model=KEY picks one)
{
  const sel = $("model-sel"), list = (typeof GECKO_LABELS !== "undefined") ? GECKO_LABELS : [["", G.source]];
  for(const [key, label] of list){ const o = document.createElement("option"); o.value = key; o.textContent = label; sel.appendChild(o); }
  sel.value = (typeof GECKO_KEY !== "undefined") ? GECKO_KEY : list[0][0];
  sel.onchange = () => { const u = new URL(location.href); u.searchParams.set("model", sel.value); location.href = u.toString(); };
}
window.__g = {
  get t(){ return step; }, restart, look, cam,
  step: n => { for(let i = 0; i < n; i++) physicsStep(); gl.finish(); return step; },
  read: () => { const f = fields(); return {step, m: b64f(f.m), rgb: b64f(f.rgb)}; },
  readQ: k => b64f(readTex(Q[k])),
  loss: () => { measure(); return [lossM, lossC, totalMass]; },
  damage: (x, y, r) => damage(x, y, r), displace: (x, y, r, a, b) => displace(x, y, r, a, b), push: (m, x, y, r, a, b) => push(m, x, y, r, a, b),
  snap: () => { present(); return cv.toDataURL("image/png"); },
};
if(!new URLSearchParams(location.search).has("manual")) requestAnimationFrame(loop);
</script>
